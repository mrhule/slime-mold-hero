<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Commander stand-in</title>
    <style>
      body { margin: 0; padding: 16px; background: #10130d; color: #e8ead9; font: 15px/1.5 system-ui, sans-serif; display: grid; gap: 14px; justify-items: start; }
      h1 { margin: 0; font: 28px Impact, 'Arial Black', sans-serif; color: #f3cf57; letter-spacing: 2px; }
      button, input { font: inherit; padding: 8px 14px; border: 3px solid #0b0b0b; background: #6f7a55; color: #fff; cursor: pointer; }
      input { width: 90px; text-transform: uppercase; text-align: center; background: #11140e; cursor: text; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      canvas { background: #1b2016; border: 3px solid #0b0b0b; touch-action: none; max-width: 100%; }
      pre { margin: 0; background: #181c13; border: 2px solid #0b0b0b; padding: 8px 12px; min-height: 90px; width: min(100%, 420px); font-size: 12px; overflow: auto; }
      #status { font-weight: 600; }
      #panel { display: grid; gap: 10px; width: min(100%, 520px); }
      #nutrients { font: 22px Impact, 'Arial Black', sans-serif; color: #8fd264; letter-spacing: 1px; }
      .bar { position: relative; height: 22px; background: #11140e; border: 3px solid #0b0b0b; }
      .bar i { position: absolute; inset: 0 auto 0 0; }
      .bar.hp i { background: #d8503a; } .bar.mana i { background: #3f7bd6; }
      .bar span { position: relative; font-size: 12px; padding-left: 6px; }
      #ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
      .up { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #181c13; border: 2px solid #0b0b0b; padding: 4px 8px; }
      .up button { padding: 4px 10px; min-width: 70px; }
      button:disabled { filter: grayscale(1) brightness(0.6); cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>Commander stand-in</h1>
    <p>Stands in for Slime Mold while it has no link of its own. Host a room or join one, then click the dish to drop a marker in the hero's arena.</p>
    <div class="row">
      <button id="host">Host a room</button>
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" />
      <button id="join">Join</button>
      <button id="leave">Leave</button>
      <button id="ping">Ping</button>
    </div>
    <div id="status">Solo</div>
    <div id="panel" hidden>
      <div id="nutrients"></div>
      <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
      <div class="bar mana"><i id="manaBar"></i><span id="manaTxt"></span></div>
      <div class="row"><button id="healBtn">Heal 40% · 40</button><button id="manaBtn">Refill mana · 30</button><span id="heroInfo"></span></div>
      <div class="row"><button id="frontBtn">Open front</button><button id="recallBtn" disabled>Recall</button><span id="frontInfo">No front open</span></div>
      <div class="bar hp"><i id="pressBar"></i><span id="pressTxt"></span></div>
      <div id="ups"></div>
    </div>
    <div class="row"><label>Season <select id="season"><option>spring</option><option>summer</option><option>fall</option><option>winter</option></select></label>
      <label>Weather <select id="weather"><option>clear</option><option>rain</option><option>storm</option><option>fog</option><option>frost</option><option>snow</option><option>blizzard</option></select></label></div>
    <div class="row">
      <label>Click does <select id="tool"><option value="marker">marker (free)</option><option value="strike">artillery strike</option><option value="turret">build turret</option><option value="wall">build wall</option></select></label>
      <label>Zoom <input type="range" id="zoom" min="1" max="5" step="0.1" value="1"></label>
      <span id="viewInfo">no view yet</span>
    </div>
    <canvas id="dish" width="560" height="560" style="max-width:100%"></canvas>
    <pre id="log"></pre>
    <script type="module" src="/commander/main.ts"></script>
  </body>
</html>
